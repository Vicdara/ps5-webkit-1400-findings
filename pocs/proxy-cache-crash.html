<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>proxy cache</title></head>
<body>
<script>
// JSC Proxy handler-traps cache: poly-proto handler whose prototype is set to null.
// Missing hasMonoProto guard in ProxyObject::isHandlerTrapsCacheValid (Sony WebKit-1400).
function makePolyProtoObject() {
    function foo() {
        class C { constructor() { this._field = 42; } }
        return new C;
    }
    for (let i = 0; i < 15; ++i)
        foo();
    return foo();
}

const handler = makePolyProtoObject();
Object.setPrototypeOf(handler, Object.prototype);
handler.get = (target, key) => "got " + key;

const proxy = new Proxy({}, handler);
proxy.foo;

Object.setPrototypeOf(handler, null);
proxy.foo;

document.title = "no crash";
</script>
</body>
</html>
